spring.application.name=manejo-caatingueiro
server.port=${PORT:8080}

# Banco de Dados Supabase (PostgreSQL via JDBC)
# Exemplo de DB_URL no Render:
# jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

spring.jackson.default-property-inclusion=non_null
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Mensagens em português
spring.web.locale=pt-BR
spring.web.locale-resolver=fixed

# Segurança (JWT e CORS para o Vercel supernovaweb)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiracao-minutos=${JWT_EXPIRACAO_MIN:480}
app.cors.allowed-origins=${ALLOWED_ORIGINS:https://supernovaweb.vercel.app,http://localhost:3000}

# Fonte de dados climáticos (RF18): "open-meteo" (dados reais do território de Irecê/BA) ou "stub"
app.clima.fonte=${CLIMA_FONTE:open-meteo}
app.clima.ingestao-agendada=${CLIMA_INGESTAO_AGENDADA:true}
app.clima.ingestao-cron=0 0 5 * * *
app.clima.anos-minimos-serie=10
app.clima.inicio-estacao-chuvosa-mes=11
app.clima.dias-chuva-recente=7
app.clima.janela-padrao-dias=30

# Sugestão consultiva (RF06)
app.sugestao.faixa-atencao=0.6

# Monitor comunitário (RN15): mínimo de responsáveis para exibir agregado
app.monitor.minimo-participantes=${MONITOR_MIN_PARTICIPANTES:3}

# Módulos comunitários ativados para conclusão do projeto
app.features.mural=${FEATURE_MURAL:true}
app.features.checklist=${FEATURE_CHECKLIST:true}

# Gestor inicial (criado automaticamente no primeiro boot)
app.bootstrap.gestor-telefone=${BOOTSTRAP_GESTOR_TELEFONE:74999990000}
app.bootstrap.gestor-senha=${BOOTSTRAP_GESTOR_SENHA:senha123}
app.bootstrap.gestor-nome=${BOOTSTRAP_GESTOR_NOME:Gestor Garimpeiros IFBA}
app.bootstrap.localidade-nome=${BOOTSTRAP_LOCALIDADE:Irecê}

springdoc.swagger-ui.path=/swagger-ui.html
