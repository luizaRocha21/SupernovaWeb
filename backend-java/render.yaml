services:
  - type: web
    name: manejo-caatingueiro-api
    runtime: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        sync: false # Ex: jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
      - key: DB_USER
        sync: false # Ex: postgres.seu_projeto_id
      - key: DB_PASSWORD
        sync: false # Senha do banco no Supabase
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://supernovaweb.vercel.app,http://localhost:3000,http://127.0.0.1:5500
      - key: CLIMA_FONTE
        value: open-meteo
      - key: CLIMA_INGESTAO_AGENDADA
        value: "true"
      - key: BOOTSTRAP_GESTOR_TELEFONE
        value: "74999990000"
      - key: BOOTSTRAP_GESTOR_SENHA
        value: "senha123"
      - key: BOOTSTRAP_LOCALIDADE
        value: "Irecê"
