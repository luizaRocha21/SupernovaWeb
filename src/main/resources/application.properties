spring.application.name=manejo-caatingueiro
server.port=${PORT:8080}

# Banco (MySQL): URL, usuário e senha SEMPRE por variável de ambiente
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

spring.jackson.default-property-inclusion=non_null
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Mensagens de validação em português
spring.web.locale=pt-BR
spring.web.locale-resolver=fixed

# Segurança (JWT)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiracao-minutos=${JWT_EXPIRACAO_MIN:480}

# Fonte de dados climáticos (RF18). "stub" = dados sintéticos de desenvolvimento
app.clima.fonte=${CLIMA_FONTE:stub}
app.clima.ingestao-agendada=${CLIMA_INGESTAO_AGENDADA:false}
app.clima.ingestao-cron=0 0 5 * * *
app.clima.anos-minimos-serie=10
app.clima.inicio-estacao-chuvosa-mes=11
app.clima.dias-chuva-recente=7
app.clima.janela-padrao-dias=30

# Sugestão consultiva (RF06): razão chuva/limiar a partir da qual o tom passa de "atenção" para "alternativa"
app.sugestao.faixa-atencao=0.6

# Monitor comunitário (RN15): mínimo de responsáveis distintos para exibir o agregado
app.monitor.minimo-participantes=5

# Módulos não validados em campo (gate de validação): desligados por padrão
app.features.mural=false
app.features.checklist=false

# Gestor inicial (opcional): criado só se ainda não existir nenhum gestor
app.bootstrap.gestor-telefone=${BOOTSTRAP_GESTOR_TELEFONE:}
app.bootstrap.gestor-senha=${BOOTSTRAP_GESTOR_SENHA:}
app.bootstrap.gestor-nome=${BOOTSTRAP_GESTOR_NOME:Gestor inicial}
app.bootstrap.localidade-nome=${BOOTSTRAP_LOCALIDADE:Município inicial}

springdoc.swagger-ui.path=/swagger-ui.html
