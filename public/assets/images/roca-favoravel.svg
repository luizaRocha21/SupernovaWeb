<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Condição Favorável — Solo úmido, chuva mansa, milho, feijão e mandacaru">
  <defs>
    <clipPath id="clip-medallion-fav">
      <circle cx="120" cy="120" r="110" />
    </clipPath>
  </defs>

  <!-- Fundo base do medalhão -->
  <circle cx="120" cy="120" r="112" fill="#fbf6e9" stroke="#542817" stroke-width="5" />

  <g clip-path="url(#clip-medallion-fav)" stroke="#542817" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Céu creme claro -->
    <rect x="0" y="0" width="240" height="240" fill="#fbf6e9" stroke="none" />

    <!-- Sol ocre à direita com raios -->
    <g>
      <circle cx="176" cy="64" r="24" fill="#bd7627" />
      <line x1="176" y1="28" x2="176" y2="18" />
      <line x1="202" y1="38" x2="210" y2="30" />
      <line x1="212" y1="64" x2="222" y2="64" />
      <line x1="202" y1="90" x2="210" y2="98" />
      <line x1="150" y1="38" x2="142" y2="30" />
      <line x1="164" y1="29" x2="161" y2="21" stroke-width="1.8" />
      <line x1="190" y1="31" x2="194" y2="23" stroke-width="1.8" />
    </g>

    <!-- Nuvem suave 1 (esquerda/centro) -->
    <path d="M44 74 C34 74, 28 66, 31 57 C33 49, 42 45, 50 48 C55 38, 69 36, 78 43 C86 39, 98 44, 100 54 C108 56, 111 65, 106 71 C103 74, 96 74, 44 74 Z" fill="#fffaf0" />
    <path d="M48 67 C62 65, 78 65, 94 67" fill="none" stroke-width="1.6" opacity="0.6" />

    <!-- Nuvem suave 2 (centro/direita sobre o sol) -->
    <path d="M112 86 C104 86, 99 79, 102 72 C104 66, 112 63, 118 66 C123 58, 134 57, 141 63 C148 61, 156 66, 156 74 C162 76, 163 83, 157 86 Z" fill="#e9efe2" />

    <!-- Chuva inclinada (gotas fertilizando a terra) -->
    <g stroke="#7ba39b" stroke-width="2.4">
      <line x1="48" y1="82" x2="42" y2="96" />
      <line x1="64" y1="84" x2="58" y2="99" />
      <line x1="80" y1="82" x2="74" y2="97" />
      <line x1="95" y1="85" x2="89" y2="99" />
      <line x1="55" y1="104" x2="49" y2="117" />
      <line x1="72" y1="106" x2="66" y2="120" />
      <line x1="88" y1="105" x2="82" y2="118" />
      <line x1="116" y1="94" x2="110" y2="108" />
      <line x1="131" y1="95" x2="125" y2="110" />
      <line x1="146" y1="94" x2="140" y2="108" />
      <line x1="122" y1="114" x2="116" y2="127" />
      <line x1="138" y1="115" x2="132" y2="128" />
    </g>
    <!-- Detalhe de gotas com traço marrom sutil -->
    <g stroke="#542817" stroke-width="1.5" opacity="0.55">
      <line x1="64" y1="84" x2="61" y2="91" />
      <line x1="95" y1="85" x2="92" y2="92" />
      <line x1="131" y1="95" x2="128" y2="102" />
    </g>

    <!-- Colina ao fundo (camada 1 - verde musgo/oliva) -->
    <path d="M0 158 Q65 138, 132 152 T240 146 L240 240 L0 240 Z" fill="#6b7048" />
    <!-- Textura na colina verde -->
    <path d="M95 154 Q118 149, 145 155" fill="none" stroke-width="1.6" />
    <path d="M162 151 Q188 146, 214 150" fill="none" stroke-width="1.6" />

    <!-- Camada intermediária do solo (camada 2 - terracota fértil) -->
    <path d="M0 174 Q82 160, 150 175 T240 168 L240 240 L0 240 Z" fill="#8c583a" />
    <!-- Sulcos de plantio no solo terracota -->
    <path d="M22 182 Q70 172, 124 182" fill="none" stroke-width="1.8" />
    <path d="M138 184 Q178 176, 220 181" fill="none" stroke-width="1.8" />

    <!-- Camada frontal profunda do solo (camada 3 - marrom-terra escuro) -->
    <path d="M0 198 Q75 186, 142 199 T240 193 L240 240 L0 240 Z" fill="#542817" />
    <!-- Sementes e nutrientes na base escura -->
    <g stroke="#fbf6e9" stroke-width="1.8" opacity="0.7">
      <line x1="48" y1="210" x2="64" y2="208" />
      <line x1="92" y1="214" x2="114" y2="213" />
      <line x1="145" y1="212" x2="165" y2="210" />
      <circle cx="80" cy="208" r="1.5" fill="#fbf6e9" />
      <circle cx="132" cy="215" r="1.5" fill="#fbf6e9" />
      <circle cx="182" cy="208" r="1.5" fill="#fbf6e9" />
    </g>

    <!-- Pé de milho viçoso à esquerda com espiga dourada -->
    <g>
      <!-- Caule do milho -->
      <path d="M64 192 C64 162, 65 132, 65 104" fill="none" stroke="#542817" stroke-width="3.2" />
      <!-- Folhas largas arqueadas -->
      <path d="M64 170 C48 158, 30 162, 22 174 C34 172, 50 174, 64 178 Z" fill="#5d603d" />
      <path d="M65 148 C46 134, 26 138, 18 152 C32 148, 49 150, 65 156 Z" fill="#5d603d" />
      <path d="M65 144 C82 130, 100 135, 106 148 C94 144, 79 146, 65 152 Z" fill="#5d603d" />
      <path d="M65 122 C49 110, 34 112, 27 124 C39 121, 52 123, 65 129 Z" fill="#5d603d" />
      <path d="M65 118 C80 105, 95 108, 101 119 C89 117, 77 119, 65 125 Z" fill="#5d603d" />
      <!-- Espiga de milho dourada -->
      <path d="M67 138 C74 126, 84 126, 82 140 C80 148, 72 152, 66 148 Z" fill="#bd7627" />
      <line x1="72" y1="132" x2="77" y2="143" stroke-width="1.4" />
      <line x1="76" y1="130" x2="71" y2="144" stroke-width="1.4" />
      <!-- Pendão no topo do milho -->
      <path d="M65 104 L59 93 M65 104 L65 91 M65 104 L72 94" fill="none" stroke="#bd7627" stroke-width="2.2" />
      <path d="M65 104 L59 93 M65 104 L65 91 M65 104 L72 94" fill="none" stroke="#542817" stroke-width="1.2" />
    </g>

    <!-- Brotos verdes de feijão no centro -->
    <g>
      <!-- Muda central 1 -->
      <path d="M114 195 C114 178, 115 166, 118 154" fill="none" stroke="#542817" stroke-width="2.6" />
      <path d="M115 170 C103 162, 95 166, 98 175 C103 177, 111 175, 115 170 Z" fill="#5d603d" />
      <path d="M116 164 C128 156, 136 160, 133 169 C128 171, 120 169, 116 164 Z" fill="#5d603d" />
      <path d="M118 154 C112 144, 122 140, 125 149 C124 153, 120 155, 118 154 Z" fill="#6b7048" />
      <!-- Muda central 2 -->
      <path d="M142 196 C142 183, 141 174, 139 166" fill="none" stroke="#542817" stroke-width="2.3" />
      <path d="M141 176 C133 170, 127 173, 130 180 C134 181, 139 179, 141 176 Z" fill="#5d603d" />
      <path d="M140 171 C148 165, 154 168, 151 175 C147 176, 143 174, 140 171 Z" fill="#5d603d" />
    </g>

    <!-- Cacto Mandacaru à direita -->
    <g>
      <!-- Tronco principal -->
      <path d="M180 188 L180 112 C180 105, 192 105, 192 112 L192 188 Z" fill="#5d603d" />
      <!-- Braço esquerdo -->
      <path d="M180 152 L168 152 C163 152, 160 148, 160 142 L160 124 C160 119, 169 119, 169 124 L169 142 L180 142 Z" fill="#5d603d" />
      <!-- Braço direito -->
      <path d="M192 160 L203 160 C208 160, 211 156, 211 150 L211 132 C211 127, 202 127, 202 132 L202 150 L192 150 Z" fill="#5d603d" />
      <!-- Nervuras verticais de xilogravura -->
      <line x1="186" y1="110" x2="186" y2="186" stroke-width="1.5" />
      <!-- Flor do mandacaru abrindo com a chuva -->
      <circle cx="186" cy="105" r="4.5" fill="#fffaf0" />
      <circle cx="186" cy="105" r="2" fill="#bd7627" stroke="none" />
    </g>
  </g>

  <!-- Aro duplo editorial sertanejo -->
  <circle cx="120" cy="120" r="112" fill="none" stroke="#542817" stroke-width="5" />
  <circle cx="120" cy="120" r="106" fill="none" stroke="#542817" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.65" />
</svg>
