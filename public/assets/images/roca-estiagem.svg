<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Reserva da Cisterna — Pôr do sol sertanejo, cisterna de placas, carnaúbas e mandacaru">
  <defs>
    <clipPath id="clip-medallion-estiagem">
      <circle cx="120" cy="120" r="110" />
    </clipPath>
  </defs>

  <!-- Fundo base do medalhão -->
  <circle cx="120" cy="120" r="112" fill="#fbf6e9" stroke="#542817" stroke-width="5" />

  <g clip-path="url(#clip-medallion-estiagem)" stroke="#542817" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Céu em pôr do sol ocre/dourado -->
    <rect x="0" y="0" width="240" height="240" fill="#f3dfb6" stroke="none" />
    <path d="M0 90 Q120 70, 240 90 L240 165 L0 165 Z" fill="#d4943a" stroke="none" opacity="0.45" />

    <!-- Raios solares longos irradiando do sol ao fundo -->
    <g stroke="#bd7627" stroke-width="2" opacity="0.65">
      <line x1="120" y1="88" x2="30" y2="28" />
      <line x1="120" y1="88" x2="68" y2="14" />
      <line x1="120" y1="88" x2="120" y2="10" />
      <line x1="120" y1="88" x2="172" y2="14" />
      <line x1="120" y1="88" x2="210" y2="28" />
      <line x1="120" y1="88" x2="16" y2="68" />
      <line x1="120" y1="88" x2="224" y2="68" />
    </g>

    <!-- Sol ocre grande de fim de tarde -->
    <circle cx="120" cy="84" r="34" fill="#bd7627" />
    <circle cx="120" cy="84" r="26" fill="none" stroke="#fbf6e9" stroke-width="1.3" stroke-dasharray="5 4" opacity="0.7" />

    <!-- Colinas terracota ao fundo -->
    <path d="M0 148 Q58 128, 120 144 T240 138 L240 240 L0 240 Z" fill="#a64f2e" />
    <path d="M0 172 Q85 158, 165 170 T240 164 L240 240 L0 240 Z" fill="#8c4124" />
    <path d="M0 198 Q105 188, 240 196 L240 240 L0 240 Z" fill="#542817" />

    <!-- Duas palmeiras / carnaúbas sertanejas à esquerda -->
    <g>
      <!-- Carnaúba 1 -->
      <path d="M46 164 Q42 132, 38 100" fill="none" stroke="#542817" stroke-width="3" />
      <path d="M38 100 L22 96 M38 100 L24 88 M38 100 L32 82 M38 100 L44 82 M38 100 L52 88 M38 100 L54 98 M38 100 L26 106 M38 100 L50 106" stroke="#5d603d" stroke-width="2.5" />
      <circle cx="38" cy="100" r="3.5" fill="#542817" />
      <!-- Carnaúba 2 (menor) -->
      <path d="M64 166 Q62 142, 60 118" fill="none" stroke="#542817" stroke-width="2.5" />
      <path d="M60 118 L48 115 M60 118 L50 108 M60 118 L58 104 M60 118 L66 105 M60 118 L72 112 M60 118 L72 120" stroke="#5d603d" stroke-width="2.2" />
    </g>

    <!-- Cisterna cilíndrica de placas no centro -->
    <g>
      <!-- Corpo cilíndrico de placas/blocos -->
      <path d="M84 128 L84 172 C84 180, 156 180, 156 172 L156 128 Z" fill="#c8a97e" />
      <!-- Teto cônico caiado de branco -->
      <path d="M78 128 L120 102 L162 128 Z" fill="#fffaf0" />
      <ellipse cx="120" cy="128" rx="42" ry="6" fill="#e9dec8" />
      <!-- Linhas horizontais e verticais das placas de cimento -->
      <path d="M84 143 C102 148, 138 148, 156 143" fill="none" stroke-width="1.8" />
      <path d="M84 158 C102 163, 138 163, 156 158" fill="none" stroke-width="1.8" />
      <line x1="102" y1="131" x2="102" y2="145" stroke-width="1.6" />
      <line x1="120" y1="132" x2="120" y2="146" stroke-width="1.6" />
      <line x1="138" y1="131" x2="138" y2="145" stroke-width="1.6" />
      <line x1="93" y1="145" x2="93" y2="160" stroke-width="1.6" />
      <line x1="111" y1="146" x2="111" y2="161" stroke-width="1.6" />
      <line x1="129" y1="146" x2="129" y2="161" stroke-width="1.6" />
      <line x1="147" y1="145" x2="147" y2="160" stroke-width="1.6" />
      <line x1="104" y1="160" x2="104" y2="175" stroke-width="1.6" />
      <line x1="124" y1="161" x2="124" y2="176" stroke-width="1.6" />
      <line x1="142" y1="160" x2="142" y2="175" stroke-width="1.6" />
      <!-- Bica / registro vertendo água preciosa -->
      <rect x="115" y="164" width="10" height="8" rx="2" fill="#542817" />
    </g>

    <!-- Caminho de água saindo da cisterna -->
    <path d="M120 172 C116 184, 102 194, 92 212 C84 224, 90 236, 98 240 L146 240 C142 224, 134 206, 128 190 C125 182, 123 176, 120 172 Z" fill="#7ba39b" />
    <path d="M116 188 Q120 192, 125 188" fill="none" stroke="#fffaf0" stroke-width="1.6" />
    <path d="M108 206 Q116 210, 126 206" fill="none" stroke="#fffaf0" stroke-width="1.6" />
    <path d="M104 222 Q118 227, 132 222" fill="none" stroke="#fffaf0" stroke-width="1.6" />

    <!-- Cacto Mandacaru à direita -->
    <g>
      <path d="M184 184 L184 114 C184 107, 195 107, 195 114 L195 184 Z" fill="#5d603d" />
      <path d="M184 148 L173 148 C168 148, 166 144, 166 138 L166 122 C166 117, 174 117, 174 122 L174 138 L184 138 Z" fill="#5d603d" />
      <path d="M195 154 L205 154 C210 154, 212 150, 212 144 L212 130 C212 125, 204 125, 204 130 L204 144 L195 144 Z" fill="#5d603d" />
      <line x1="189.5" y1="112" x2="189.5" y2="182" stroke-width="1.5" />
    </g>
  </g>

  <!-- Aro duplo editorial sertanejo -->
  <circle cx="120" cy="120" r="112" fill="none" stroke="#542817" stroke-width="5" />
  <circle cx="120" cy="120" r="106" fill="none" stroke="#542817" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.65" />
</svg>
